<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Unwritten Story — AI Test Harness</title>
    <link rel="stylesheet" type="text/css" href="fonts/gamefont.css">
    <style>body { background-color: black; margin: 0; }</style>
</head>
<body>
    <!-- AI 自动化验证入口：与 index.html 相同的启动序列，
         但补上本工程 index.html 缺失的 fpsmeter / js-yaml 库，
         并先加载 node_compat.js 垫片（require/fs/nw.gui → 浏览器模拟）。
         仅用于浏览器测试，游戏本体入口仍是 index.html。 -->
    <script>
    window.__bootlog = [];
    window.__log = function (type, args) {
        try {
            window.__bootlog.push(type + ': ' + Array.prototype.map.call(args, function (a) {
                if (a instanceof Error) return a.message + '\n  ' + String(a.stack || '').split('\n').slice(1, 4).join('\n  ');
                return String(a);
            }).join(' | '));
            if (window.__bootlog.length > 200) { window.__bootlog.shift(); }
        } catch (e) {}
    };
    window.addEventListener('error', function (e) {
        window.__log('onerror', [e.message + ' @ ' + e.filename + ':' + e.lineno]);
    });
    window.addEventListener('unhandledrejection', function (e) {
        window.__log('rejection', [e.reason]);
    });
    ['error', 'warn'].forEach(function (k) {
        var orig = console[k].bind(console);
        console[k] = function () { window.__log('console.' + k, arguments); orig.apply(null, arguments); };
    });
    // 抓引擎崩溃处理器的原始异常（Graphics._printError 只打 stack 首行会丢消息）
    // 错误挂钩（2026-10-02 修时序盲区）：原版包在 load 事件里——
    // load 之前发生的资源 Loading Error 会漏掉首批。改为立即挂 + 轮询兜底
    // （SceneManager/Graphics 由更早的 script 标签定义，此处必已存在）。
    (function () {
        function hookAll() {
            if (window.SceneManager) {
                ['catchException', 'onError'].forEach(function (fn) {
                    if (typeof SceneManager[fn] !== 'function') { return; }
                    if (SceneManager[fn].__hooked) { return; }
                    var orig = SceneManager[fn];
                    var wrapped = function (e) {
                        window.__log('SceneManager.' + fn, [e]);
                        return orig.call(this, e);
                    };
                    wrapped.__hooked = true;
                    SceneManager[fn] = wrapped;
                });
            }
            if (window.Graphics && Graphics._makeErrorHtml && !Graphics._makeErrorHtml.__hooked) {
                var origHtml = Graphics._makeErrorHtml;
                var wrappedHtml = function (name, message) {
                    try { window.__log('Graphics.屏显错误', [String(name) + ': ' + String(message)]); } catch (e) {}
                    return origHtml.apply(this, arguments);
                };
                wrappedHtml.__hooked = true;
                Graphics._makeErrorHtml = wrappedHtml;
            }
        }
        hookAll();                                        // 立即挂一次
        var tries = 0;
        var t = setInterval(function () {                 // 轮询兜底（防脚本顺序意外）
            tries++;
            hookAll();
            if (window.Graphics && Graphics._makeErrorHtml && Graphics._makeErrorHtml.__hooked &&
                window.SceneManager && SceneManager.catchException && SceneManager.catchException.__hooked) {
                clearInterval(t);
            } else if (tries > 40) { clearInterval(t); }
        }, 250);
    })();
    // 语言自愈（2026-10-01 除根）：本环境自然启动时 LanguageManager._data 常为空，
    // 标题创建 getTextData 会崩并每帧重试刷屏。轮询补齐 en+sc，一劳永逸。
    (function () {
        var tries = 0;
        var t = setInterval(function () {
            tries++;
            if (window.LanguageManager && !window.__langHealed) {
                // 判定标准必须是 sc.text 里真的有键（loadLanguageFiles 依赖 fs.readdirSync
                // 在浏览器跑不了 → 之前的"自愈"是死代码，标题崩溃刷屏的真正根源）
                var healthy = LanguageManager._data && LanguageManager._data.sc &&
                              LanguageManager._data.sc.text && Object.keys(LanguageManager._data.sc.text).length > 50;
                if (!healthy && window.AIPLAY && window.AIPLAY.feedLanguages) {
                    try {
                        AIPLAY.feedLanguages('en');
                        AIPLAY.feedLanguages('sc');
                        window.__langHealed = true;
                        window.__log('harness', ['语言自愈(v2): XHR+jsyaml 全量喂入完成']);
                    } catch (e) { window.__log('harness', ['语言自愈失败: ' + e.message]); }
                } else if (healthy) {
                    window.__langHealed = true;
                }
            }
            if (window.__langHealed || tries > 120) { clearInterval(t); }
        }, 500);
    })();
    // IAB/无焦点环境下 requestAnimationFrame 可能被暂停（页面可见也不回调）。
    // 自检：500ms 内没有任何 rAF 回调 → 换成 setTimeout 驱动的 60fps 降级实现，
    // 并重启游戏主循环的 PIXI ticker（它可能已持有失效的 rAF 请求句柄）。
    (function () {
        var nativeRaf = window.requestAnimationFrame.bind(window);
        var fired = false;
        nativeRaf(function () { fired = true; });
        setTimeout(function () {
            if (fired) { return; }
            window.__log('harness', ['rAF 未回调，启用 setTimeout 降级驱动']);
            window.requestAnimationFrame = function (cb) {
                return setTimeout(function () { cb(performance.now()); }, 16);
            };
            try {
                if (window.SceneManager && SceneManager.ticker) {
                    SceneManager.ticker.stop();
                    SceneManager.ticker.start();
                }
            } catch (e) { window.__log('harness', ['ticker 重启失败: ' + e.message]); }
        }, 500);
    })();
    // 主循环看门狗 + isFocus 恒真（2026-10-03 修：rAF 开局正常、页签隐藏后才死掉的场景
    // 旧兜底救不了；且 isFocus 覆写原来只在 rAF 兜底分支里，失焦时 updateScene 会
    // 静默跳过 scene.update() → 标题淡出 _fadeDuration=48 永不递减、换场被 busy 卡死）。
    (function () {
        var installed = false, ticks = 0, lastTicks = -1, stalled = 0;
        function installOverrides() {
            // GTP 的 isFocus() 检查 window.top.document.hasFocus()，IAB 内嵌环境永远为 false
            // → 场景更新/输入/渲染全部被静默跳过（"失焦即停"）。测试环境恒返回已聚焦。
            try {
                if (window.SceneManager) {
                    SceneManager.isFocus = function () { return true; };
                    if (SceneManager._smoothDeltaTime === undefined) { SceneManager._smoothDeltaTime = 1; }
                    var om = SceneManager.updateMain;
                    if (om && !om.__counted) {
                        var wrapped = function () { window.__mainTicks = (window.__mainTicks || 0) + 1; return om.apply(SceneManager, arguments); };
                        wrapped.__counted = true;
                        SceneManager.updateMain = wrapped;
                    }
                }
            } catch (e) { window.__log('harness', ['isFocus/updateMain 覆写失败: ' + e.message]); }
        }
        function installFallback() {
            if (installed) { return; }
            installed = true;
            window.__log('harness', ['主循环停跳 >2s，启用降级驱动']);
            window.requestAnimationFrame = function (cb) {
                return setTimeout(function () { cb(performance.now()); }, 16);
            };
            try {
                if (window.SceneManager && SceneManager.ticker) {
                    SceneManager.ticker.stop();
                    SceneManager.ticker.start();
                }
            } catch (e) { window.__log('harness', ['ticker 重启失败: ' + e.message]); }
            // 隐藏页签连 setTimeout/setInterval 都会被整体挂起（rAF 降级也不管用），
            // Worker 的 postMessage 是唯一不受节流的唤醒源。
            // updateMain 按真实墙钟累计固定步长 → 与恢复后的 rAF 并行调用无副作用。
            try {
                if (!window.__workerDriver && typeof Worker !== 'undefined') {
                    var blob = new Blob(['setInterval(function(){postMessage(0);},16);'],
                                        { type: 'application/javascript' });
                    var w = new Worker(URL.createObjectURL(blob));
                    w.onmessage = function () {
                        try {
                            if (window.SceneManager && SceneManager.updateMain) {
                                SceneManager.updateMain.call(SceneManager);
                            }
                        } catch (e) {}
                    };
                    window.__workerDriver = w;
                    window.__log('harness', ['Worker 驱动器已安装']);
                }
            } catch (e) { window.__log('harness', ['Worker 驱动失败: ' + e.message]); }
        }
        installOverrides();
        // Worker 驱动器：启动即装（不依赖停跳检测——隐藏页签下 rAF 降到 1-2fps 时
        // tick 仍在变，检测器会误判"活着"）。updateMain 按真实墙钟累计固定步长，
        // 与任何 rAF 并行调用都无副作用。
        try {
            if (typeof Worker !== 'undefined' && !window.__workerDriver) {
                var blob = new Blob(['setInterval(function(){postMessage(0);},16);'],
                                    { type: 'application/javascript' });
                var wk = new Worker(URL.createObjectURL(blob));
                wk.onmessage = function () {
                    try {
                        if (window.SceneManager && SceneManager.updateMain) {
                            SceneManager.updateMain.call(SceneManager);
                        }
                    } catch (e) {}
                };
                window.__workerDriver = wk;
                window.__log('harness', ['Worker 驱动器已安装']);
            }
        } catch (e) { window.__log('harness', ['Worker 驱动失败: ' + e.message]); }
        var t = setInterval(function () {
            installOverrides();                      // 引擎可能中途重定义，反复确保
            ticks = window.__mainTicks || 0;
            if (ticks === lastTicks) { stalled++; } else { stalled = 0; }
            lastTicks = ticks;
            if (stalled >= 2) { installFallback(); } // 连续 ~2s 无主循环 → 换驱动（只换一次）
        }, 1000);
    })();
    // ?muted=1：测试页签全程静音（用户要求测试不得出声）。
    // v2（2026-10-03 根治漏音）：旧实现靠 2s 轮询归零音量，游戏开机 1-3s 的闪屏 BGM
    // 会漏出来（每开一个新页签响约 2 秒）→ 改为直接空操作化全部播放入口，声音永远无法起始。
    (function () {
        if (!/[?&]muted=1/.test(location.search)) { return; }
        function muteAll() {
            try {
                if (window.ConfigManager) { ConfigManager.bgmVolume = 0; ConfigManager.bgsVolume = 0; ConfigManager.meVolume = 0; ConfigManager.seVolume = 0; }
                if (window.WebAudio && WebAudio.setMasterVolume) { WebAudio.setMasterVolume(0); }
            } catch (e) {}
        }
        function neuterAudio() {
            try {
                if (window.AudioManager && !AudioManager.__neutered) {
                    ['playBgm', 'playBgs', 'playMe', 'playSe', 'replayBgm', 'replayBgs'].forEach(function (fn) {
                        if (typeof AudioManager[fn] === 'function') { AudioManager[fn] = function () {}; }
                    });
                    AudioManager.stopBgm(); AudioManager.stopBgs();
                    AudioManager.__neutered = true;
                }
            } catch (e) {}
        }
        // 引擎脚本在本内联脚本之后同步加载（rpg_managers 加载前 AudioManager 不存在）→
        // 100ms 快轮询直到掐掉播放入口（首拍即中，之后空操作化永久生效），40 拍后停
        var guard = 0;
        var t = setInterval(function () {
            muteAll();
            neuterAudio();
            if (++guard > 40 || (window.AudioManager && AudioManager.__neutered && guard > 10)) { clearInterval(t); }
        }, 100);
        window.addEventListener('load', function () { muteAll(); neuterAudio(); });
        window.__log('harness', ['静音模式 v2 开启 (?muted=1)：播放入口已空操作化']);
    })();
    // data/*.json HTTP 缓存强刷（2026-10-03）：旧测试服务器不带 no-store 头，
    // 浏览器对 data/*.json 做启发式缓存 → 引擎启动 XHR 一直复用几天前的旧 System.json
    // （实测：磁盘 2101 个开关槽，游戏只加载到 2001 → 模组 2001+ 开关静默失效）。
    // 现服务器已 no-store，但只对"之后首次"的响应生效，救不了已缓存条目 →
    // 首载异步强刷全部 data json，完成后自动 reload 一次（sessionStorage 标记防循环）。
    (function () {
        try {
            if (sessionStorage.getItem('__dataCacheBusted') === '2') { return; }
            sessionStorage.setItem('__dataCacheBusted', '1');
            fetch('data/', { cache: 'reload' }).then(function (r) { return r.text(); }).then(function (html) {
                var re = /href="([A-Za-z0-9_]+\.json)"/g, m, ps = [];
                while ((m = re.exec(html)) !== null) {
                    (function (f) { ps.push(fetch('data/' + f, { cache: 'reload' }).catch(function () {})); })(m[1]);
                }
                return Promise.all(ps);
            }).then(function () {
                window.__log('harness', ['data/*.json 缓存强刷完成，自动重载']);
                sessionStorage.setItem('__dataCacheBusted', '2');
                location.reload();
            }).catch(function () {
                sessionStorage.setItem('__dataCacheBusted', '2');
            });
        } catch (e) {}
    })();
    </script>
    <script type="text/javascript" src="js/libs/fpsmeter.js"></script>
    <script type="text/javascript" src="js/libs/js-yaml-browser.js"></script>
    <script type="text/javascript" src="node_compat.js"></script>
    <script type="text/javascript" src="ai_play.js?v=36&seal=3"></script>
    <script type="text/javascript" src="js/libs/pixi.js"></script>
    <script type="text/javascript" src="js/libs/pixi-tilemap.js"></script>
    <script type="text/javascript" src="js/libs/pixi-picture.js"></script>
    <script type="text/javascript" src="js/libs/lz-string.js"></script>
    <script type="text/javascript" src="js/libs/iphone-inline-video.browser.js"></script>
    <script type="text/javascript" src="js/rpg_core.js"></script>
    <script type="text/javascript" src="js/rpg_managers.js"></script>
    <script type="text/javascript" src="js/rpg_objects.js"></script>
    <script type="text/javascript" src="js/rpg_scenes.js"></script>
    <script type="text/javascript" src="js/rpg_sprites.js"></script>
    <script type="text/javascript" src="js/rpg_windows.js"></script>
    <script type="text/javascript" src="js/plugins.js"></script>
    <script>
    // 语言预载（2026-09-30 补）：标题画面 createTitleCommands 在语言数据未就绪时会抛异常
    // → SceneManager.catchException 停摆主循环。在 main.js 启动前同步加载全部语言。
    (function () {
        try {
            if (window.LanguageManager) {
                if (typeof LanguageManager.loadAllLanguageFiles === 'function') {
                    LanguageManager.loadAllLanguageFiles();
                    window.__log && window.__log('harness', ['语言预载: loadAllLanguageFiles 完成']);
                } else if (typeof LanguageManager.loadLanguageFiles === 'function') {
                    LanguageManager.loadLanguageFiles('en');
                    LanguageManager.loadLanguageFiles('sc');
                    window.__log && window.__log('harness', ['语言预载: en+sc 完成']);
                }
            }
        } catch (e) { window.__log && window.__log('harness', ['语言预载失败: ' + e.message]); }
    })();
    </script>
    <script type="text/javascript" src="js/main.js"></script>
</body>
</html>
