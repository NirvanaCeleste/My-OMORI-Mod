# YIN BLACKJACK
# =========================================================================================

Yin_Blackjack:
  bets: [$5,$25,$100,やめる] # Those are the strings in the bet commands
  jack_commands: [スタンド, ヒット] # Those are the commands for blackjack. They will be uppercased.
  dealer_streak: ディーラー %1 # %1 is streak string
  player_streak: プレイヤー %1 # %1 is streak string
  streak_string: "連勝記録： %1" # %1 is the player/dealer streak value
  score: "スコア： ディーラー%1   プレイヤー%2" # %1 and %2 are dealer and player scores
  bet: "ベット：$%1 x%2Total Cash - $%3" # Format numbers references to wagerAmount, playerBonus and currentEarnings
  maincommands: [ニューゲーム, コンティニュー, やめる] # Blackjack commands. They will be uppercased.

