# 第一夜梦境占位文本（设计文档 docs/设计_第一夜_20261002.md · 全部为占位，待作者定稿）
# 引导两句定第一夜情绪基调，作者改稿优先级最高
d1_intro_1:
  text: （梦境）这里很安静。\!<br>天花板很远，脚下没有声音。
d1_intro_2:
  text: 房间的正中央，浮着一本书。\!它好像在等你。
d1_book_hint:
  text: 指尖碰到封面的瞬间，\!字开始浮现。
d1_wake:
  text: ……写完了。\!<br>眼皮沉了下来。
d1_look_1:
  text: 窗帘在轻轻飘。\!没有风。
d1_look_2:
  text: 角落里有一把小提琴的影子。\!看不清。
