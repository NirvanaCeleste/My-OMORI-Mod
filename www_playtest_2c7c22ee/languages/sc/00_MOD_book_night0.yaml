      text: '“那……先由我一个人送报纸。”Basil说。


        “你？”Aubrey瞪大了眼睛。“你起得来吗？你每天早上都要赖床！”


        “……我起得来。”Basil说。


        第一天早上，天还没亮，闹钟响的时候，Basil在黑暗里坐了很久，才爬起来。


        报纸很重。他一家一家送，送到最后一条街的时候，太阳已经升起来了。


        他坐在路边的台阶上喘了很久。


        第二天，第三天。他每天都会路过琴行，看一眼橱窗里的琴，再接着走。


        第四天早上，Aubrey出现在街角。


        “……你怎么来了？”Basil问。


        “路过。”Aubrey说。“顺便看看你死没死。”


        “没死。”Basil说。


        “那就好。”Aubrey说。“明天我跟你一起送。”


        “……嗯。”Basil说。

        '
