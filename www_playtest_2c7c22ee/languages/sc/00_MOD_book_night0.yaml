      text: '没有人再说那句“一起攒钱”的话。


        但第二天早上，Kel还是出门了。报纸很重，他没有告诉任何人。


        Aubrey和Basil支起了摊子。Kel在送报纸。


        秋天的时候，Hero和Mari也默默加入了。


        “我们在面包店排上了下午的班。”Mari轻描淡写地说。


        “老板人很好，还让我们带卖剩的面包回来。”Hero补了一句。


        Basil张了张嘴，想说谢谢，又咽了回去。


        铁盒放在架子上，没有人说那是干什么用的。但硬币一天比一天多。


        Basil没有问是谁放的。


        他只知道，有一天他打开铁盒，里面已经满了。


        他不记得是谁放进去的。可能是Aubrey。可能是他自己。也可能是Mari回来的时候放了一些。


        他不记得桌子是谁搬的。不记得纸板是谁写的。不记得冰桶是谁买的。


        铁盒满了。他记得这件事。不记得它是怎么满的。

