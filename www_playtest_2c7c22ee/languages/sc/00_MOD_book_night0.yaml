      text: '第二天，Basil一个人去了琴行。


        店员把那把小提琴拿出来，翻来覆去看了很久。


        “太小了。”店员说。“这种是玩具琴，没有配件能修。就算修好了，Sunny也拉不了了。”


        Basil站在柜台前，没有动。


        “……那买一把新的呢？”他问。


        店员报了价。Basil安静了很久。


        “谢谢。”他说。“我再想想。”


        他走出琴行，在门口站了一会儿。


        他想起Sunny把琴藏在书包里的样子。


        “修不了。”他回到树屋，对大家说。“太小了，没有配件。”


        “……那怎么办？”Kel问。


        “买。”Basil说。“买一把新的。慢慢攒。”


        **“如果我们都付出一点努力，说不定……真的能实现。”**

        '
