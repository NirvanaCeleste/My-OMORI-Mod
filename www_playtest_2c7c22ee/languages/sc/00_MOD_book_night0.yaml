        origin:
        - 48
        - 56
        speed: 4
      text: '“先卖旧书旧玩具，凑一点是一点。”Basil说。


        第二天，他们把各自不用的东西搬到了树屋门口。


        Kel抱来一摞旧漫画。Aubrey拿来一个用不上的旧台灯。Basil翻出几本看过的书。


        “就这些？”Kel问。


        “就这些。”Basil说。


        他们在街角摆了一下午。卖掉了一本漫画、一个台灯，换回来几枚硬币。


        Basil把钱放进铁盒，数了数。


        “……太少了。”他说。


        “差的远呢。”Aubrey说。


        他们看着那个空荡荡的铁盒，沉默了一会儿。


        “……还是得打工。”Basil说。“光靠卖旧东西，攒到圣诞节也不够。”


        “那就打工！”Kel说。“送报纸、摆摊——我们都能行！”


        “我和Mari等秋天去面包店。”Hero说。“到时候也能添一份。”


        “好。”Basil说。“那就……一点一点来。”

        '
    christmas:
      write:
        origin:
        - 48
        - 56
        speed: 4
      edits:
      - id: gC
        variants:
        - “拆开试试吧，这是你的琴。”
        - “把琴放在树屋里，等他自己去发现。”
      text: '圣诞节，Sunny坐在客厅地板上。


        他面前只有一个盒子。蓝色包装纸，白色的绳。


        “今年，你的礼物只有一份。”Mari说。


        **“这是来自我们所有人的心意。”**


        “虽然包装看上去很普通……”Basil说，“不过，我们大家一起攒钱，才把它买下来的。”


        “是呀！暑假的时候，我和贝瑟尔为了攒钱，甚至去摆摊卖曲奇饼和柠檬水呢。”Aubrey说。


        “如果你还有印象的话，玛里和我之前在一家面包店工作过一段时间。”Hero说。


        “而我呢，每天早上去送报纸，送了整整三个月……”Kel说，“你也知道我有多讨厌早起！”


        Sunny没有说话。


        他把盒子抱起来，拆开。


        琴身泛着光。新的。

        '
