      text: '“那把旧琴，修一修还能用吧。”


        Basil说。他自己也没想到自己会这么说。


        树屋里安静了一拍。


        “……能修吗？”Kel挠了挠头。“它那么小。”


        “去琴行问问就知道了。”Basil说。“先问了再说。”


        Aubrey没说话。她看了Basil一眼，又看了一眼窗外的琴房方向。


        “那就先去问问。”Hero合上书。“修得好就修，修不好再想别的办法。”


        Basil点了点头。


        那天晚上他睡得不太好。他一直在想，那把琴到底还能不能修。

        '
    plan:
