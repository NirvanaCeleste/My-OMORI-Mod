      text: '“从现在开始，大家一起攒钱吧。”Basil说。


        从那天起，每个人都开始忙起来。


        Kel每天天没亮就去送报纸。第一周他差点迟到三次，被Aubrey嘲笑了整整一周。


        Aubrey和Basil在街角支起了摊子。曲奇饼干是Mari烤的，柠檬水是Basil调的。第一天只卖出去几杯，但他们没有收摊。


        夏天先这样。


        秋天一到，是Mari先提起的。


        “我和Hero去面包店问问吧。”Mari在厨房里说。“下午的班，应该能排上。”


        “会不会太辛苦？”Basil问。


        “不会。”Mari说。“我们想去。多一个人，就多一份力。”


        Hero点了点头。“面包店的老板人很好。你们放心，我们俩能行。”


        铁盒里的硬币一天比一天多。


        那个秋天快结束的时候，Basil把铁盒放在桌上，打开。


        “够了。”他说。

