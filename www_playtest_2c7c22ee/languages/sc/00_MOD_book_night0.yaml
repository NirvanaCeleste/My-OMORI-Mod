      text: 'Basil说完，没有人立刻接话。


        阳光落在地板上，慢慢移动。


        “……行啊。”Kel说。“那去看看呗！”


        “嗯。”Aubrey说。


        Hero点了点头。“明天先去琴行看看，一把琴要多少钱。看了再说。”


        “那就这么定了。”Basil说。


        那天下午他们聊了很多。钱的事，谁做什么，还有什么。


        Basil没有再说话。他靠着门框，看着窗外。Sunny从远处走过，低着头。


        他看着Sunny走远。

        '
