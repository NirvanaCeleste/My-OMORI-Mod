        “当然起得来！送报纸我可熟了！”Kel说。


        第一天早上，闹钟响的时候，Kel在床上坐了整整十分钟。


        “……我是谁……我在哪……”他嘟囔着爬起来。


        报纸很重。他第一天送完最后一家，坐在路边的台阶上喘了很久。


        第二天，他差点迟到。第三天，他准时了。


        Aubrey站在街角等他：“哟，没迟到。”


        “我厉害吧！”Kel说。


        “……还行吧。”Aubrey说。“明天我也来。”


        “你来干嘛？”


        “帮忙啊。你一个人送，得送到中午去。”


        “……哦。”Kel说。“那行！”


        后来那个夏天，送报纸的变成了两个人。

