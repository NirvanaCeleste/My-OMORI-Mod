      text: '“别急，等Sunny生日再说吧。”


        Basil说。声音不大。


        树屋里安静了一下。


        “……生日？”Kel眨了眨眼。“那不是还有半年？”


        “嗯。”Basil说。“反正也不急这一天两天。先把礼物的事想好，到时候再告诉他。”


        Aubrey看了他一会儿。“……行吧。那就先不说。”


        “先不说。”Basil说。


        那天晚上他们聊了别的事。谁也没再提琴。


        可Basil回家之后，在床边坐了很久。


        他翻出自己存零钱的盒子，打开看了看，又合上了。

        '
