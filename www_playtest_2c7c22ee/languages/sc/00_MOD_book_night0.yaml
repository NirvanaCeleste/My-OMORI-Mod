      write:
        origin:
        - 48
        - 56
        speed: 4
      text: '“这是来自我们所有人的心意。”Mari说。


        她没有再解释。Sunny也没有问。


        他打开琴盒，把琴拿出来，放在膝盖上。


        客厅里很安静。只有包装纸轻轻响了一声，像在说“收下吧”。

        '
