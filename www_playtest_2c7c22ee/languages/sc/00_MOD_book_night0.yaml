      text: '“那我们……从明天开始，一点一点地攒。”Basil说。


        第二天早上，天还没亮，Kel就出门了。


        “我出发了！”他喊着，声音消失在清晨的街道上。


        Aubrey和Basil在街角支起了摊子。曲奇饼干是Mari烤的，柠檬水是Basil调的。


        “曲奇！柠檬水！第一天开张，买一送一！”Aubrey吆喝起来。


        “第一天就送，那我们赚什么？”Basil小声说。


        “你闭嘴。”Aubrey说。


        秋天一到，是Mari先提起的。


        “我和Hero去面包店问问吧。”Mari说。“下午的班，应该能排上。”


        “会不会太辛苦？”Basil问。


        “不会。”Mari说。“我们想去。多一个人，就多一份力。”


        Hero点了点头。“面包店的老板人很好。你们放心，我们俩能行。”


        日子一天天过去。铁盒里的硬币一天比一天多。


        那个秋天快结束的时候，Basil把铁盒放在桌上，打开。


        “够了。”他说。


        大家围过来看。铁盒里，硬币叠着硬币。

