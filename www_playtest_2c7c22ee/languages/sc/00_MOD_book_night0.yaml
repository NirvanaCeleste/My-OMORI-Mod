        speed: 4
      readonly: true
      text: 'Sunny即将在新小提琴上拉出第一个音。


        琴弓悬在半空。他的心里，涌起一阵焦急的感觉——像站在很高很高的地方，风从耳边吹过。


        那种焦急使他不安，但是他并不介意。


        因为他们相信着他。


        而且，无论发生什么事情……


        他不想让他们失望。


        因为他们是他的朋友。


        琴弓落下去。


        门外，有人站了一会儿，没有进去。

        '
    practice:
