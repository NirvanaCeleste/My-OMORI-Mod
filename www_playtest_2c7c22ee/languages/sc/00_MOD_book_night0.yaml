        他们在街角摆了一下午。卖掉了一本漫画、一个台灯，换回来几枚硬币。


        Basil把钱放进铁盒，数了数。


        “……太少了。”他说。


        “差的远呢。”Aubrey说。


        “那就打工。”Kel说。“走！明天我送报纸的时候，你也一起来！”


        “我……也去？”Basil问。


        “对啊！两个人送得快！”Kel说。“反正夏天嘛，起早一点也没关系！”

