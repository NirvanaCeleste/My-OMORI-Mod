      readonly: true
      text: '那之后，Sunny开始和Mari一起练习。


        Mari弹钢琴，Sunny拉小提琴。同一首曲子，一遍，又一遍，像两条小溪慢慢汇成一条河。


        “你进步得很快。”Mari说。


        Sunny没有回答。他低着头，看自己的手指。


        “音乐会之前，”Mari说，“我们一定能合得很好。”


        Sunny点了点头。


        琴声从房间里传出来，飘过走廊，飘得很远很远。

        '
