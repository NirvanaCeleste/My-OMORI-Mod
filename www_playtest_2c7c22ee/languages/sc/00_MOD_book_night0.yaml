      text: '第二天，他们一起去了琴行。


        橱窗里摆着一排小提琴。最便宜的那把，标价也比他们想象的高。


        “贵是贵了点……”Kel说，“不过包在我们身上！”


        “你早上送报纸？”Aubrey问。


        “对啊！送报纸我可熟了！”Kel说。


        “我和贝瑟尔可以先摆摊，卖曲奇和柠檬水。”Aubrey说。“夏天嘛，大家都想喝点凉的。”


        “那我和Mari……等秋天再说。”Hero说。“夏天面包店不太缺人。”


        Basil没有立刻说话。他低头想了想，才小声开口。


        “Sunny他……值得一把好琴。如果我们也都能……尽一点力的话。”


        **“如果我们都付出一点努力，说不定……真的能实现。”**'
