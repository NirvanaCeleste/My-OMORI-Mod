  trigger:
    sentence: gB
    action: erase
  editable: gC
  pages:
    plan:
      write:
        origin:
        - 48
        - 56
        speed: 4
      text: '那句话没有被说出来。


        铁盒放在架子上，一直空着。


        Basil偶尔会看看它。


        “你到底想放什么进去？”Aubrey有一天问。


        “……不知道。”Basil说。“大概什么也不放。”


        “那你老看它干嘛？”


        Basil没有回答。


        那个夏天过去了。秋天过去了。


        圣诞节前几天，Basil路过琴行，在橱窗前站了很久。


        老板娘出来，看见他。


        “你站了快半年了。”她说。


        Basil的脸红了。“……我想买那把琴。”


        “那把最便宜的？”老板娘问。


        “嗯。”


        “钱够了吗？”


        Basil沉默了一下。“……快了。”


        “那把琴我给你留着。”老板娘说。“你放心。”


        Basil点了点头。他不知道自己为什么会说“快了”。

        '
    christmas:
      write:
        origin:
        - 48
        - 56
        speed: 4
      edits:
      - id: gC
        variants:
        - 那个盒子，Sunny拆得很慢。
        - 把琴放在树屋里，等他自己去发现。
      text: '圣诞节，Sunny坐在客厅地板上。


        他面前只有一个盒子。蓝色包装纸，白色的绳。


        没有人说它是什么时候出现的。


        “今年，你的礼物只有一份。”Mari说。


        “虽然包装看上去很普通……”Basil说。


        他没有说下去。


        **那个盒子，Sunny拆了很久。**'
- id: s21
  parent: s5
  trigger:
    sentence: gC
    action: variant
    value: 0
  pages:
    christmas:
      write:
        origin:
        - 48
        - 56
        speed: 4
      text: '“拆开试试吧，这是你的琴。”Mari说。


        Sunny抬起头，看了她一会儿。又看了Basil、Aubrey、Kel、Hero——每个人都安安静静地站在那里，像一排等他开口的树。


        他没有说话。


        他把盒子放在膝盖上，拆开。琴身泛着光。


        他把它拿起来，握了很久。

        '
- id: s22
  parent: s5
  trigger:
    sentence: gC
    action: variant
    value: 1
  pages:
    christmas:
      write:
        origin:
        - 48
        - 56
        speed: 4
      text: '“把琴放在树屋里，等他自己去发现。”Basil说。


        圣诞那天，他们没有把琴送到Sunny面前。


        琴被放在树屋的窗台上，用一块布盖着。


        第二天下午，Sunny推开门，看见了那块布。


        他走过去，掀开。


        琴身泛着光。新的。


        他站在原地，站了很久。

        '
- id: s23
  parent: s5
  trigger:
    sentence: gC
    action: keep
  pages:
