      text: '那个夏天，树屋里多了很多笑声。


        西瓜、海边、萤火虫。Kel在草地上翻跟头，Aubrey嘴上嫌他吵，还是给他递了水。Hero烤棉花糖烤糊了三根，Mari在旁边笑。


        没有人提琴的事。


        Basil路过琴行，放慢了脚步，又走过去了。


        有一天下午，他自己坐在树屋里，手里捏着一枚硬币，翻来覆去地转。


        “贝瑟尔？”Aubrey探头进来。“你干嘛呢？”


        “……没什么。”Basil把硬币收进口袋。


        “走吧，去买汽水。”Aubrey说。“Kel请客。”


        “他请客？”Basil笑了。


        “他说他赢了一局篮球，开心。”


        Basil站起来，跟着她走了。


        **那枚硬币，Basil后来又掏出来看了很久。**

        '
- id: s5
