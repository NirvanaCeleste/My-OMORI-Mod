      text: 'Mari开始认真练习钢琴。


        琴声从二楼传下来，落在走廊上，又落进树屋里。Sunny坐在琴房角落，抱着膝盖，安安静静地听。他不说话，也不走。Mari练多久，他就坐多久。


        后来，朋友们发现了Sunny的一个秘密。


        他有一把琴。


        那是一把迷你小提琴，尺寸小得不像话——琴身比正常的小提琴短了一大截，琴弓也短，像是给小孩子玩的。Kel是在树屋里撞见的：Sunny把它藏在书包里，拉了一小段，又飞快地塞回去。


        “嘿——那不是……你有一把小提琴？”Kel说。


        Sunny点了点头。


        “哇！这也太小了吧！你平时就用这个练琴？”Kel叫起来。


        “……Kel，小声点。”Basil说。


        “你有点礼貌行不行。”Aubrey说。


        Sunny没有说话。他把琴拿出来，又拉了一小段。声音很细，像一只鸟在很远很远的地方叫。


        “那首曲子……”Kel眨了眨眼，“是Mari最近一直在练的吧！”


        Sunny没有点头，也没有摇头。他把琴飞快地塞回了书包里。


        Basil看着他，看了很久。


        那天晚上，Basil把大家叫到树屋里。


        “Sunny他……其实一直想和Mari一起拉琴。”Basil说。“我见过他偷偷练。”


        “那咱们帮他不就完了！”Kel说。


        Basil点了点头。他张了张嘴，那句话在嘴边停了一下，才说出口。


        **“给Sunny买一把琴吧。”**

        '
    reaction:
