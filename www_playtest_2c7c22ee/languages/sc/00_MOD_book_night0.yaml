        - “那天之后，Basil开始每天路过琴行。”
      text: '那个夏天，没有人提起琴的事。


        树屋照常热闹。西瓜、海边、萤火虫。Kel缠着Hero打篮球，Aubrey在一边看，一边说自己不玩。


        Basil每次都笑着说好，笑得比谁都轻。


        但他一个人路过琴行的时候，会放慢脚步，在橱窗前站一会儿。


        他没有告诉任何人。


        **他一个人，悄悄把零钱存进铁盒。**


        他把自己存零钱的盒子放在架子上，每天往里放几枚硬币。

        '
