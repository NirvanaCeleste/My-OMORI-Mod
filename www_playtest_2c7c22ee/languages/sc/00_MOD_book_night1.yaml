        text: |
          演出那天，Sunny走上舞台。

          台下坐满了人。

          Basil坐在角落里。

          Sunny站定。

          灯光亮起来。

          Mari坐在钢琴前。

          一切都很正常。

          太正常了。

          **“Sunny走上舞台。”**
  - id: s5
    parent: s1
    trigger: { sentence: "gB", action: variant, value: 0 }
    editable: gC
    pages:
      stage:
        write:
          origin: [48, 56]
          speed: 4
        edits:
