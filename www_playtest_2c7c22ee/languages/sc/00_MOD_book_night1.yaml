              - "“第一个音，在琴弦上停留了很久。”"
        text: |
          Sunny站在舞台中央。

          灯光落在他身上。

          台下的声音慢慢静下来。

          他闭上眼，又睁开。

          Mari的钢琴，轻轻起了一个音。

          **“Sunny拉出第一个音。”**
