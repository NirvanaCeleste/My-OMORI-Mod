          他放下琴弓。

          台下开始有窃窃私语。

          Sunny低着头。

          Mari站起来，走过去，轻轻拍了拍他的肩。

          “没关系。”Mari说。“下次吧。”

          Basil在台下，看着他们走回后台。

          音乐会没有开始，就结束了。

          他走出礼堂，天还亮着。

          他回头看了一眼。

          礼堂的灯已经关了。

          他站了一会儿。

          他忽然想：如果刚才，Sunny拉出那个音——

          礼堂会不会就不一样了？

          会不会就一直是亮的？

          他站了很久。

          礼堂的门关着。

          里面很安静。

          安静得像是从来没有人来过。
  - id: s61
    parent: s15
    trigger: { sentence: "gC", action: variant, value: 0 }
    pages:
      firstnote:
        write:
          origin: [48, 56]
          speed: 4
        text: |
          第一个音，很准。

          Sunny接着拉了下去。

          Mari的钢琴跟上来。

          音乐在礼堂里流开。

          台下的人安静地听着。

          Basil坐在人群里，看着Sunny。

          Sunny没有停。

          他一直拉下去，拉完了一整首。

          最后一个音落下。

          掌声响起来。

          Mari站起来，朝台下鞠躬。

          Sunny也鞠了一躬。

          Basil用力鼓掌。

          音乐会成功了。

          大家都说，这是一场很好的演出。

          Basil走出礼堂，天已经黑了。

          他回头看了一眼。

          礼堂的灯还亮着。

          他忽然觉得，好像少了点什么。

          他想了很久。

          ——琴声。

          散场之后，就没有琴声了。

          礼堂的灯亮着，但是很安静。

          太安静了。

          安静得像是从来没有人来过。
  - id: s62
    parent: s15
    trigger: { sentence: "gC", action: variant, value: 1 }
    pages:
      firstnote:
        write:
          origin: [48, 56]
          speed: 4
        text: |
          第一个音，在琴弦上停留了很久。

          Sunny没有立刻拉下一个音。

          琴声悬在空气里。

          Mari的钢琴，也跟着停了一拍。

          台下很安静。

          Sunny低着头，看着琴弦。

          然后他接着拉了下去。

          音乐响起来。

          一首，两首。

          掌声一阵接一阵。

          音乐会成功了。

          大家都说，Sunny和Mari配合得真好。

          Basil在人群里，笑得眼睛都弯了。

          散场的时候，他走在最后。

          他路过舞台。

          舞台上已经没有人了。

          只有一架钢琴，一把琴凳。

          琴声已经停了。

          Basil站在舞台边，站了一会儿。

          他忽然想：刚才的琴声，真的是从这里传出来的吗？

          礼堂很安静。

          安静得像是从来没有人来过。
  - id: s63
    parent: s15
    trigger: { sentence: "gC", action: keep }
    pages:
      firstnote:
        write:
          origin: [48, 56]
          speed: 4
        text: |
          Sunny拉出第一个音。

          琴声在礼堂里响起来。

          Mari的钢琴跟着进来。

          音乐很稳。

          Basil在台下听着，心里渐渐安定下来。

          “成了。”他想。

          演出很成功。

          掌声很响。

          Sunny和Mari站在一起，朝台下鞠躬。

          Basil看见Mari笑了。

          他很久没见过Mari那样笑了。

          散场之后，Basil帮大家收拾。

          他路过舞台的时候，看见Sunny的琴盒还开着。

          琴已经放进去了。

          他弯腰，把琴盒合上。

          咔哒。

          礼堂安静下来。

          Basil直起身，忽然发现礼堂里只剩下他一个人。

          灯一盏一盏地灭。

          他在黑暗里站了一会儿。

          琴声已经没有了。

          他想起刚才的掌声。

          那么响。

          现在却安静得像是从来没有人来过。
