# ============================================================================
# 《未竟之事》第一夜 —— 《音乐会》
# 作者：NirvanaCeleste
# ============================================================================
# 原创。第零夜之后，Sunny 和 Mari 练习，准备那场音乐会。
# Basil 想让演出成功——彩排、上台、第一个音。
# 但每一次"成功"，都有一点不对：琴声停了，掌声变安静，
# 礼堂亮着灯，却安静得像是从来没有人来过。
# 结局：音乐会没有举行。
# ============================================================================

defaults:
  speed: 4
  mode: sequential
  allowExit: false

order:
  - rehearsal
  - stage
  - firstnote
  - ending
  - confirm

states:
  - id: s0
    editable: gA
    pages:
      rehearsal:
        write:
          origin: [48, 56]
          speed: 4
        edits:
          - id: gA
            variants:
              - "“Sunny在琴房里，拉得很流畅。”"
              - "“Sunny在琴房里，一直练习到很晚。”"
        text: |
          那场音乐会，再过七天就要举行了。

          Sunny在琴房里练习。Mari坐在钢琴前，翻着乐谱。

          琴声从二楼传下来，落在走廊上，又落进树屋里。

          Basil站在楼下，听着。

          他听过很多次了。Sunny的琴声，从生涩到流畅，从断断续续到连成一片。

          “会成功的。”Basil想。

          “一定会成功的。”

          他想起Sunny第一次拿到琴的样子。

          那时候，Sunny的眼睛亮了一下。

          **“Sunny在琴房里练习。”**
      ending:
        write:
          origin: [48, 56]
          speed: 4
        readonly: true
        text: |
          音乐会没有举行。

          琴声停下来的时候，Basil在楼下站了很久。

          他想起那七天。

          每一天，Sunny都在练习。

          每一天，琴声都从二楼传下来。

          可是音乐会……

          音乐会没有举行。
      confirm:
        write:
          origin: [48, 56]
          speed: 4
        readonly: true
        confirm: true
        doneSwitchId: 2002
        confirmChoices:
          - "确定"
          - "否"
        text: |
          书在这里合上了。
          要合上书吗？
  - id: s1
    parent: s0
    trigger: { sentence: "gA", action: variant, value: 0 }
    editable: gB
    pages:
      rehearsal:
        write:
          origin: [48, 56]
          speed: 4
        text: |
          Sunny在琴房里，拉得很流畅。

          Basil在楼下听了一会儿，忽然觉得，这一次一定不一样。

          琴声没有停。

          一直到他走回树屋，琴声还在。
      stage:
        write:
          origin: [48, 56]
          speed: 4
        edits:
          - id: gB
            variants:
              - "“Sunny站在舞台中央。”"
              - "“Sunny走到舞台最边上。”"
        text: |
          演出那天，Sunny走上舞台。

          台下坐满了人。

          Basil坐在中间，看着Sunny走到舞台中央。

          Sunny站定，鞠了一躬。

          灯光亮起来。

          Mari坐在舞台一侧的钢琴前，朝他点了点头。

          Sunny把琴架到肩上。

          **“Sunny走上舞台。”**
  - id: s2
    parent: s0
    trigger: { sentence: "gA", action: variant, value: 1 }
    editable: gB
    pages:
      rehearsal:
        write:
          origin: [48, 56]
          speed: 4
        text: |
          Sunny在琴房里，一直练习到很晚。

          Basil路过琴房门口，看见灯还亮着。

          他轻轻推开门，想让他休息一下。

          Sunny没有抬头。

          琴声没有停。
      stage:
        write:
          origin: [48, 56]
          speed: 4
        edits:
          - id: gB
            variants:
              - "“Sunny站在舞台中央。”"
              - "“Sunny走到舞台最边上。”"
        text: |
          演出那天，Sunny走上舞台。

          台下坐满了人。

          Basil坐在最前排，看着Sunny。

          Sunny站定，鞠了一躬。

          灯光明晃晃的。

          Mari坐在钢琴前，指尖放在琴键上。

          Sunny把琴架到肩上。

          **“Sunny走上舞台。”**
  - id: s3
    parent: s0
    trigger: { sentence: "gA", action: keep }
    editable: gB
    pages:
      rehearsal:
        write:
          origin: [48, 56]
          speed: 4
        text: |
          Sunny在琴房里练习。

          Basil在楼下听。

          琴声断了一下，又续上。

          “没事的。”Basil想。“第一次上台，都会紧张。”

          他靠在树屋的门框上，听着琴声一点一点变稳。

          那七天，他每天都是这样过的。
      stage:
        write:
          origin: [48, 56]
          speed: 4
        edits:
          - id: gB
            variants:
              - "“Sunny站在舞台中央。”"
              - "“Sunny走到舞台最边上。”"
        text: |
          演出那天，Sunny走上舞台。

          台下坐满了人。

          Basil坐在人群里，看着Sunny。

          Sunny站定，鞠了一躬。

          Mari坐在钢琴前，看着他。

          Sunny深吸了一口气。

          琴弓搭上琴弦。

          **“Sunny走上舞台。”**
  - id: s4
    parent: s0
    trigger: { sentence: "gA", action: erase }
    editable: gB
