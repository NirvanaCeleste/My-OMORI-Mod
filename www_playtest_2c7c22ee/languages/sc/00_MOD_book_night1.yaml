          琴声从二楼传下来。

          Basil在楼下，听了一会儿。

          琴声很好。

          好得像是已经练习了很多年。

          他没有上楼。他没有打扰。

          他站在树屋里，听着。
      stage:
        write:
          origin: [48, 56]
          speed: 4
        edits:
          - id: gB
            variants:
              - "“Sunny站在舞台中央。”"
