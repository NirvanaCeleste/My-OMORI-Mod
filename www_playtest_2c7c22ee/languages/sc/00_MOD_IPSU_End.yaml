message_0:
  text: 骗子。

message_1:
  text: 这扇门被上锁了，\!你往里面看去……

message_2:
  text: 一个少年坐在桌前写信，\!桌上有着很多盖章的法律文件，\!墙上贴着一个女孩的照片……\!他看起来很自责……\!你听不清他在低语什么……

message_3:
  text: 门锁被踹得变形，\!碎玻璃散了一地。\!粉发女孩靠墙蹲着，\!手背的伤口正渗着血。\!她的眼神空洞，\!看起来很绝望……\!你听不清她在说什么……

message_4:
  text: 大雨磅礴，\!一个少年打着伞，\!背对着你站墓碑前，\!肩膀无声抽动着，\!他看起来很孤独……\!你听不清他在说什么……

message_5:
  text: 搬空的客厅落满灰尘，\!墙面上留着相框印子。\!两个成年人背对着站在玄关，\!脚边立着行李箱。\!他们已经尽力了，\!看起来很疲惫……\!你听不清他们在说什么……

message_6:
  text: 一个女人一下一下拔着花盆里的野草，\!偶尔轻轻叹一口气，很轻很轻。\!电话铃一直在响，\!但是她好像没有听到，\!她始终没有回头，\!影子落在地上，拉得很长……

message_7:
  text: 一张看起来很舒服的床，\!你想要躺在里面吗？

message_8:
  text: 是

message_9:
  text: 否

