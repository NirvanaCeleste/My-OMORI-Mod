message_1:
  text: ……………………\!<br>……啊\!……发生什么了

message_2:
  text: 天花板，白得刺眼。\!还有仪器持续的滴滴声。

message_3:
  faceset: MainCharacters_Faraway
  faceindex: 17
  text: ……贝瑟尔？ \kel

message_4:
  text: 你头晕目眩，想要说话，但却发不出声音来。

message_5:
  faceset: MainCharacters_Faraway
  faceindex: 23
  text: \{ \quake[1]贝瑟尔醒了！\!<br>护士！我去叫护—— \kel\quake[0] \fr

message_6:
  faceset: MainCharacters_Faraway
  faceindex: 27
  text: 凯！你小声点……\!他好不容易才醒过来。\!你这样只会让他更紧张。\aub

message_7:
  text: 这里……\!不是那里……\!<br>SUNNY呢……？\!<br>他还好吗？

message_8:
  faceset: MainCharacters_Faraway
  faceindex: 15
  text: 啊，抱歉抱歉……\!\kel

message_9:
  faceset: MainCharacters_Faraway
  faceindex: 27
  text: 抱歉……\!<br>我应该早点注意到的……\!<br>我赶到的时候……\!<br>你和SUNNY已经倒在那里了。\!<br>我真的吓坏了……\!<br>我不知道发生了什么。\!<br>但是……\!<br>如果有什么事情的话……\!<br>你不用一个人承受。\!<br>我们会听你说的。\aub

message_10:
  faceset: MainCharacters_Faraway
  faceindex: 28
  text: 好了，慢慢来，贝瑟尔。\!<br>有没有哪里不舒服？\her

message_11:
  text: 你的声带好像粘到一起了。\!你想说些什么。\!<br>但是话卡在喉咙里。\!你不知道该从哪里开始。\!<br>你知道自己又要撒谎了。

message_12:
  faceset: MainCharacters_Basil_mod
  faceindex: 4
  text: …………………………………………………………………………\bas

message_13:
  faceset: MainCharacters_Basil_mod
  faceindex: 5
  text: ……呃……\!我没事……\!<br>真的。\!谢谢你们……\!<br>谢谢你们还愿意来看我……\bas

message_14:
  text: 病房里安静了几秒。\!<br>心电监护在响。

message_15:
  faceset: MainCharacters_sunny_mod
  faceindex: 0
  text: …………………………………………………………………………\n<SUNNY>

message_16:
  text: SUNNY站在门口。\!你看着SUNNY。\!SUNNY看着你。\!<br>你们谁都没有说话。

message_17:
  faceset: MainCharacters_Faraway
  faceindex: 17
  text: ……SUNNY？\!你醒了？\!<br>……哇，\!你还好么？\!<br>你怎么自己走下床了？ \kel

message_18:
  faceset: MainCharacters_Faraway
  faceindex: 27
  text: ……SUNNY\!……你还好吗？\aub

message_19:
  faceset: MainCharacters_Faraway
  faceindex: 8
  text: ……SUNNY\!……我知道\!<br>我可能没有资格问这些。\!但是……\!发生了这些事……\!<br>我真的很害怕。\!<br>我不知道你们之间发生了什么。\!<br>也不知道……\!<br>是不是有什么事情，我们一直没有看到。\aub

message_20:
  faceset: MainCharacters_Faraway
  faceindex: 27
  text: 如果你愿意的话……\!如果你愿意讲讲那天晚上发生了什么的话……\!<br>我们会听的。\!不用现在回答。\!<br>只是……\!不要再一个人扛着了。\aub

message_21:
  faceset: MainCharacters_sunny_mod
  faceindex: 2
  text: …………………………………………………………………………\n<SUNNY>

message_22:
  faceset: MainCharacters_Basil_mod
  faceindex: 4
  text: …………………………………………………………………………\bas

message_23:
  faceset: MainCharacters_Basil_mod
  faceindex: 5
  text: 那些事……都不是你想干的。\!对不对，SUNNY？\!<br>是那个东西让你干的……\!SUNNY？\bas

message_24:
  faceset: MainCharacters_sunny_mod
  faceindex: 1
  text: …………………………………………………………………………\n<SUNNY>

message_25:
  faceset: MainCharacters_sunny_mod
  faceindex: 2
  text: 不……都是因为我。\!<br>我……\!我有件事一定要告诉你们……\n<SUNNY>

message_26:
  faceset: MainCharacters_sunny_mod
  faceindex: 2
  text: ……玛里\!……不是自杀。\!是我害死了她。\!那是个意外。\!我……\!我把她从楼梯上推了下去。\n<SUNNY>

message_27:
  faceset: MainCharacters_Basil_mod
  faceindex: 9
  text: …………………………………………………………\!<br>不是这样的……\bas


message_28:
  text: 放松。\!量一个血压，马上就好………\!<br>心跳有点快………\n<护士>

message_29:
  faceset: MainCharacters_Faraway
  faceindex: 22
  text: …………………………………………………………………………\!<br>……什么？\kel

message_30:
  faceset: MainCharacters_Faraway
  faceindex: 6
  text: …………………………………………………………………………\aub

message_31:
  faceset: MainCharacters_Faraway
  faceindex: 31
  text: …………………………………………………………………………\!<br>这不是真的，\!这不可能是真的，\!对吧…………\her

message_32:
  text: 你感觉胸口一阵发紧。\!你要晕倒了。\!你没听错吧？

message_33:
  faceset: MainCharacters_Basil_mod
  faceindex: 14
  text: …………………………………………………………………………\bas

message_34:
  faceset: MainCharacters_sunny_mod
  faceindex: 2
  text: …………………………………………………………………………\n<SUNNY>

message_35:
  faceset: MainCharacters_sunny_mod
  faceindex: 1
  text: 我……我受够了练习……\!我当时太生气了……\!玛里在楼梯口拦住了我……我想逃走……\!她摔下去了……\!<br>我很害怕……\!我不知道该怎么办……\!<br>我只是……\!把她抱起来……\!把她放回床上……\!<br>我一直等着……\!希望她能醒来。\n<SUNNY>

message_36:
  faceset: MainCharacters_sunny_mod
  faceindex: 2
  text: ………可是她没有醒。\!<br>我不能接受玛里……\!她真的死了……\!<br>我一直告诉自己……\!这一切都不是真的……\!<br>只要没有人知道……\!这一切就还没有发生……\n<SUNNY>

message_37:
  faceset: MainCharacters_sunny_mod
  faceindex: 2
  text: ……我不知道该怎么办了……\!<br>我的脑子里一片空白……\!<br>然后……\!等我回过神的时候……\!<br>我已经倒在地上了……\!我晕过去了……\n<SUNNY>

message_38:
  faceset: MainCharacters_Basil_mod
  faceindex: 7
  text: ……SUNNY……\!不是这样的……\!<br>你不是故意的……\bas

message_39:
  faceset: MainCharacters_Basil_mod
  faceindex: 7
  text: \bas你不是这样的人……\w[30]\^

