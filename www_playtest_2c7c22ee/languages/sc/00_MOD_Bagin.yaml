message_40:
  faceset: MainCharacters_sunny_mod
  faceindex: 1
  text: 不。\!<br>……贝瑟尔\!<br>是我这么选择的。\!<br>我没办法接受发生的一切……\!<br>我一直在欺骗自己……\n<SUNNY>

message_41:
  faceset: MainCharacters_sunny_mod
  faceindex: 2
  text: 后来……\!也是我的错……\!<br>我甚至毁掉了那些照片……\!<br>一张又一张……\n<SUNNY>

message_42:
  faceset: MainCharacters_sunny_mod
  faceindex: 2
  text: 然后……\!我把自己关在家里……\!<br>我害怕面对发生的一切……\!<br>我害怕真相……\!<br>所以我一直逃避它……\n<SUNNY>

message_43:
  faceset: MainCharacters_sunny_mod
  faceindex: 0
  text: ……我觉得……\!<br>我必须告诉你们……\!<br>全部的事情。\n<SUNNY>

message_44:
  text: 你听到英雄瘫倒在墙上，\!看起来很痛苦。\!<br>凯难以置信地摇着头，\!奥布里一直在颤抖……

message_45:
  text: SUNNY继续说着。\!<br>眼泪不断地流下来……\!<br>你感觉呼吸越来越困难……\!<br>周围的声音逐渐变得嘈杂……\!<br>你好像正在远处看着这一切发生……

message_46:
  faceset: MainCharacters_sunny_mod
  faceindex: 2
  text: 都是我的错……\n<SUNNY>

message_47:
  faceset: MainCharacters_Faraway
  faceindex: 19
  text: ……为什么\!……SUNNY\!……你为什么不早说……\kel

message_48:
  faceset: MainCharacters_Faraway
  faceindex: 26
  text: \aub\{ \quake[1]……你这个混蛋!\!<br>你怎么可以……\!<br>你怎么可以让我们一直以为…… \quake[0] \fr

message_49:
  text: 你看见奥布里举起了拳头。\!<br>她低下头，用力捶着自己的腿……

message_50:
  faceset: MainCharacters_Faraway
  faceindex: 9
  text: 是我不好……\!<br>我不应该怪贝瑟尔……\!<br>我不应该这么做……\!<br>都是因为我……\aub

message_51:
