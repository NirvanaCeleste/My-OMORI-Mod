message_54:
  faceset: MainCharacters_Faraway
  faceindex: 20
  text: 嗯……SUNNY，\!我觉得……\!我得去看看英雄。\kel

message_55:
  faceset: MainCharacters_Faraway
  faceindex: 19
  text: 我……我很快回来。\kel

message_56:
  faceset: MainCharacters_Basil_mod
  faceindex: 4
  text: SUNNY……你做到了。\!<br>谢谢你……\!<br>谢谢你愿意说出来……\!<br>我就知道……\!<br>你不是那种人……\!SUNNY。\bas

message_57:
  faceset: MainCharacters_Basil_mod
  faceindex: 5
  text: 你终于肯说出来了……\!<br>太好了……\!哈哈……\!<br>这样的话……\!<br>你不用再一个人承受了……\bas

message_58:
  faceset: MainCharacters_Basil_mod
  faceindex: 8
  text: 可是……\!<br>为什么……\!<br>为什么我一点都感觉不到轻松……\bas

message_59:
  faceset: MainCharacters_Basil_mod
  faceindex: 7
  text: 你自由了……\!<br>你应该自由了……\!<br>可是为什么……\!<br>我感觉……\bas

message_60:
  faceset: MainCharacters_Basil_mod
  faceindex: 14
  text: 四年……\!四年来……\!<br>你一直没有离开那个地方……\!我看着你逃避这一切……\!<br>我却什么都没有做……\bas

message_61:
  faceset: MainCharacters_Basil_mod
  faceindex: 6
  text: ……我把你关在房间里了，是不是？\!<br>我一直假装什么都没有发生……\!<br>可是现在……\!<br>所有事情都回来了……\bas

message_62:
  text: 病房里再次安静下来。

message_63:
  text: 没有人说话。\!<br>只有心电监护的声音，一下一下地响着。

