  faceindex: 7
  text: \bas我甚至……\w[15]\^

message_207:
  faceset: MainCharacters_Basil_mod
  faceindex: 7
  text: \bas还弄伤了你的眼睛……\w[10]\^

message_208:
  faceset: MainCharacters_Basil_mod
  faceindex: 7
  text: \bas如果我早点发现这一切就不会发生了\w[5]\^

message_209:
  faceset: MainCharacters_Basil_mod
  faceindex: 13
  text: \bas如果我早点赶到的话这一切就不会发生了\w[5]\^

message_210:
  faceset: MainCharacters_Basil_mod
  faceindex: 13
