# ============================================================================
# 《未竟之事》第零夜 —— 《礼物》（状态快照版）
# 作者：NirvanaCeleste
# ============================================================================
# 【核心机制：整本状态快照】
# - states 数组：每个状态 = 当前故事的整体版本（每页文本全部写死）
# - 每个状态只允许修改 editable 指定的那一句（天然顺序锁）
# - 玩家每成功修改/擦除一次 → 状态 +1 → 整本书按新状态重新渲染
# - pages 只写"相对上一状态变化的页"，省略的页自动继承前一状态
#
# 【剧情安全性】
# - 只写"凑钱买琴、圣诞夜送琴"的温暖日常
# - 无论怎么改，最后 Sunny 都拿到了琴（s6 固定结局）
# ============================================================================

defaults:
  speed: 4
  mode: sequential
  allowExit: false

# 页面顺序（所有状态共用）
order:
  - g_p1
  - g_p2
  - g_p3
  - g_p4
  - g_p5
  - g_p6
  - g_p7
  - g_ending
  - g_confirm

# ============================================================================
# 状态 0：原始故事（完整书）
# 可改句：gA —— "他们没有足够的钱"
# ============================================================================
states:
  - id: s0
    editable: gA
    pages:
      g_p1:
        write:
          origin: [48, 56]
          speed: 4
        edits:
          - id: gA
            variants:
              - "但是他们只差一点钱。"
              - "但是他们没有钱。"
              - "但是他们已经有足够的钱。"
        text: |
          那年夏天，他们决定给 Sunny 买一件礼物。
          没有人一开始知道该买什么。
          Kel 说可以买篮球，Aubrey 说 Sunny 已经有很多篮球了，
          Hero 提议买一把新的小提琴。Basil 觉得这个主意很好。
          **但是他们没有足够的钱。**
          所以，他们决定自己想办法。
      g_p2:
        write:
          origin: [48, 56]
          speed: 4
        text: |
          那个夏天，他们做了很多事情。
          他们卖柠檬水，帮邻居搬东西，做一切能做的零工。
          钱一点一点地攒起来。
      g_p3:
        write:
          origin: [48, 56]
          speed: 4
        text: |
          Kel 负责记账，Aubrey 负责招揽客人，
          Hero 负责照顾大家，Basil 负责把钱收好。
          Sunny 偶尔也会帮忙。
      g_p4:
        write:
          origin: [48, 56]
          speed: 4
        text: |
          钱很快就攒够了。
          到了圣诞节，他们已经买好了礼物。
      g_p5:
        write:
          origin: [48, 56]
          speed: 4
        text: |
          圣诞节前一天晚上，他们终于把礼物准备好了。
          那是一个很大的盒子，用蓝色的包装纸裹着，
          顶上系着一个歪歪的蝴蝶结。
          Sunny 不知道他们在准备什么。
      g_p6:
        write:
          origin: [48, 56]
          speed: 4
        text: |
          圣诞节晚上到了。雪落在窗外，屋里很暖。
          Sunny 坐在地上，看着面前的盒子。
          "这是给我的？" Kel 笑了："当然。"
          Sunny 慢慢打开了盒子。
      g_p7:
        write:
          origin: [48, 56]
          speed: 4
        text: |
          盒子里，躺着一把崭新的小提琴。
          他拿起了小提琴。
      g_ending:
        readonly: true
        allowExit: false
        write:
          origin: [48, 56]
          speed: 5
        text: |
          书在这里合上了。
          Basil 想不起来自己为什么要做这个梦。
          他只记得，那个圣诞节晚上，Sunny 第一次在他面前笑了。
          有些记忆是改不掉的。
          无论他们把"为什么"改成什么样子，
          那把琴都在那里，安静地，等待着第一声弦音。
      g_confirm:
        confirm: true
        confirmChoices:
          - "确定"
          - "否"
        doneSwitchId: 1008
        readonly: true
        write:
          origin: [48, 56]
          speed: 4
        text: |
          这一夜的故事，到这里就结束了。
          要合上书，睡了吗？

  # ==========================================================================
  # 状态 1：gA 改完（钱从哪来变了）→ 赚钱过程跟着变
  # 可改句：gB1 —— "他们卖了很多柠檬水"
  # ==========================================================================
  - id: s1
    editable: gB1
    pages:
      g_p2:
        write:
          origin: [48, 56]
          speed: 4
        edits:
          - id: gB1
            variants:
              - "他们卖了很多柠檬水。"
              - "他们没有卖柠檬水，而是做了别的事。"
        text: |
          那个夏天，他们做了很多事情。
          **他们卖了很多柠檬水。**
          午后最热的时候，他们抬着桌子到街角，
          杯子里的冰块叮当作响。钱不多，但一点一点地在变多。

  # ==========================================================================
  # 状态 2：gB1 改完（赚钱方式变了）→ 分工页跟着变
  # 可改句：gB3 —— "Kel 负责记账"
  # ==========================================================================
  - id: s2
    editable: gB3
    pages:
      g_p3:
        write:
          origin: [48, 56]
          speed: 4
        edits:
          - id: gB3
            variants:
              - "Kel 负责记账。"
              - "Basil 负责记账。"
              - "没有人负责记账。"
        text: |
          **Kel 负责记账。**
          他的字歪歪扭扭，但每一笔都记得清清楚楚：
          柠檬水、搬东西、帮工。账本的最后一页写着那把小提琴的价钱，
          旁边画了一把歪歪扭扭的小提琴。

  # ==========================================================================
  # 状态 3：gB3 改完（记账的人变了）→ 钱攒起来的语气变
  # 可改句：gC —— "钱很快就攒够了"
  # ==========================================================================
  - id: s3
    editable: gC
    pages:
      g_p4:
        write:
          origin: [48, 56]
          speed: 4
        edits:
          - id: gC
            variants:
              - "钱很快就攒够了。"
              - "钱一直没有攒够。"
        text: |
          **钱很快就攒够了。**
          每一天结束，铁盒都重了一点。
          他们把硬币摊在桌上数，数完相视一笑。
          夏天很长，长到足够把一件小事做成。

  # ==========================================================================
  # 状态 4：gC 改完（钱攒没攒够）→ 准备礼物的方式变（可因果断裂）
  # 可改句：gD1 —— "他们终于把礼物准备好了"
  # ==========================================================================
  - id: s4
    editable: gD1
    pages:
      g_p5:
        write:
          origin: [48, 56]
          speed: 4
        edits:
          - id: gD1
            variants:
              - "他们终于把礼物准备好了。"
              - "Basil 一个人把礼物准备好了。"
              - "没有人准备礼物，但礼物还是出现了。"
        text: |
          圣诞节前一天晚上，**他们终于把礼物准备好了。**
          那是一个很大的盒子，用蓝色的包装纸裹着，
          顶上系着一个歪歪的蝴蝶结。Kel 说包装得太丑，
          Aubrey 说已经很好了。Hero 重新把绳子系了一遍。
          Basil 站在旁边，看着盒子里的东西。
          Sunny 不知道他们在准备什么。

  # ==========================================================================
  # 状态 5：gD1 改完（谁准备的礼物）→ 圣诞夜 Sunny 的反应变
  # 可改句：gE1 —— "Sunny 慢慢打开了盒子"
  # ==========================================================================
  - id: s5
    editable: gE1
    pages:
      g_p6:
        write:
          origin: [48, 56]
          speed: 4
        edits:
          - id: gE1
            variants:
              - "Sunny 慢慢打开了盒子。"
              - "Sunny 一下子打开了盒子。"
              - "Sunny 没有打开盒子。"
        text: |
          圣诞节晚上到了。雪落在窗外，屋里很暖。
          Sunny 坐在地上，看着面前的盒子。
          "这是给我的？" Kel 笑了："当然。"
          **Sunny 慢慢打开了盒子。**

  # ==========================================================================
  # 状态 6：gE1 改完（Sunny 打开的方式）→ 拿琴（固定，不可改）
  # ==========================================================================
  - id: s6
    pages:
      g_p7:
        write:
          origin: [48, 56]
          speed: 4
        text: |
          盒子里，躺着一把崭新的小提琴。
          他拿起了小提琴。
