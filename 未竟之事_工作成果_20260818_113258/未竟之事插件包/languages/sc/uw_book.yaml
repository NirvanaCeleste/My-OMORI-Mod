# ============================================================================
# 《未竟之事》书内容数据 —— 分支状态机版本
# - 每页一句可改（**...** 片段），必须按页序 p1→p5 依次修改
# - 修改时的选择（变体/擦除）会决定后续页的文本、可选项与结局
# - 分支语法：
#     branches:
#       - when: {e1: 0}            # 前面的句子选了第0个变体
#         when: {e1: 'erase'}      # 前面的句子被擦除
#         when: {e1: 'modified'}   # 前面的句子已修改（任意方式）
#         when: {e1: 'unmodified'} # 前面的句子未修改
#         texts: [...]             # 该分支下的文本版本数组（下标=已改句数）
#         edits: [...]             # 该分支下的可改句（可选，覆盖页面默认）
#       - texts: [...]             # 无 when = 默认分支（兜底）
# - 每个版本都必须保留该页的 **可改句** 片段（与 edits 顺序对应）
# ============================================================================

defaults:
  speed: 4
  mode: sequential
  allowExit: false     # 测试用例：中途不可退出，必须翻完到确认页

order:
  - p1
  - p2
  - p3
  - p4
  - p5
  - ending
  - confirm

pages:
  # ------------------------------------------------------------
  # 一：那个下午（第一个选择点）
  # ------------------------------------------------------------
  p1:
    write:
      origin: [48, 56]
      speed: 4
    edits:
      - id: e1
        variants:
          - "接着贝瑟尔就这样被黑暗吞噬，"
          - "贝瑟尔却被一道光带走了，"
          - "贝瑟尔只是忽然不见了，"
    texts:
      - |
        那天下午，阳光照在贝瑟尔家的花坛上，向日葵开得正好。
        主角和朋友们来到贝瑟尔的家时，贝瑟尔正准备拿起他的相片给朋友看，
        突然他露出一脸恐慌的表情，脚下冒出了一股黑洞，**接着贝瑟尔就这样被黑暗吞噬，**
        消失在了朋友们的眼前。空气里只剩下相册落地的声音，和谁都没敢先开口的安静。

  # ------------------------------------------------------------
  # 二：出发（选择点2；前面 e1 的选择决定这段怎么走）
  # ------------------------------------------------------------
  p2:
    write:
      origin: [48, 56]
      speed: 4
    branches:
      - when: {e1: 0}        # e1 = 黑暗吞噬 → 常规冒险
        edits:
          - id: e2
            variants:
              - "去寻找贝瑟尔的踪迹，"
              - "去追回被夺走的贝瑟尔，"
        texts:
          - |
            等他们回过神来，奥布里已经捡起了那本相册，指尖停在最后一张照片上。
            而他们接下来要做的，就是去冒险，探索整个世界，**去寻找贝瑟尔的踪迹，**
            因为贝瑟尔在他们心中是最好的朋友，这种坚定的友谊已经在内心扎足了根，
            于是一场充满奇幻的冒险之旅就此展开。没有人知道前方等着他们的是什么。
      - when: {e1: 1}        # e1 = 被光带走 → 追光之旅
        edits:
          - id: e2
            variants:
              - "沿着那道光的痕迹追上去，"
              - "顺着光来的方向走，"
        texts:
          - |
            那道光消失得太快，快得像一个错觉。可他们知道那不是错觉。
            相册还躺在原地，贝瑟尔却不见了，只留下空气里一丝淡淡的暖意。
            他们要做的事只剩一件：**沿着那道光的痕迹追上去，**
            去一个他们从未见过的地方。奥布里把相册抱在怀里，
            轻声说：别怕，我们一定能找到他。
      - when: {e1: 2}        # e1 = 忽然不见 → 无声的寻找
        edits:
          - id: e2
            variants:
              - "一寸一寸地找遍整个小镇，"
              - "沿着他最后站过的地方找，"
        texts:
          - |
            没有黑洞，没有光，没有任何解释。贝瑟尔只是不见了，
            像一张照片被人从相册里抽走。朋友们愣在原地很久，
            然后他们开始**一寸一寸地找遍整个小镇，**
            问每一个可能见过他的人。没有人看见过他。
            只有那本相册，翻开着，停在他最后看的那一页。
      - when: {e1: 'erase'}  # e1 被擦除 → 记忆开始模糊
        edits:
          - id: e2
            variants:
              - "努力回想贝瑟尔的样子，"
              - "去问其他人还记不记得他，"
        texts:
          - |
            那天下午的事，在记忆里变得很模糊。他们记得自己去过贝瑟尔家，
            却不记得之后发生了什么。向日葵还开着，可花坛边空无一人。
            贝瑟尔……他们努力**努力回想贝瑟尔的样子，**
            却只想起一本相册，和相册里一张空白的照片。
            有什么东西正在从他们的记忆里悄悄溜走。
      - texts:               # 默认兜底：与 e1=0 相同
          - |
            等他们回过神来，奥布里已经捡起了那本相册，指尖停在最后一张照片上。
            而他们接下来要做的，就是去冒险，探索整个世界，**去寻找贝瑟尔的踪迹，**
            因为贝瑟尔在他们心中是最好的朋友，这种坚定的友谊已经在内心扎足了根，
            于是一场充满奇幻的冒险之旅就此展开。没有人知道前方等着他们的是什么。

  # ------------------------------------------------------------
  # 三：林间（选择点3）
  # ------------------------------------------------------------
  p3:
    write:
      origin: [48, 56]
      mode: simultaneous
    branches:
      - when: {e1: 0, e2: 0}   # 常规线：黑暗吞噬 + 寻找踪迹
        edits:
          - id: e3
            variants:
              - "他们遇见了会说话的树，"
              - "他们绕开了沉睡的巨人，"
        texts:
          - |
            他们走进了一片从没见过的森林。树干上长着会发光的苔藓，风穿过树叶时
            会发出低低的耳语。**他们遇见了会说话的树，**树问他们要往哪里去，
            他们说要去寻找一个被黑暗带走的朋友。树沉默了很久，指了一个方向，
            那正是连地图上都画着问号的地方。脚印在泥土里越来越深，谁也没有回头。
      - when: {e1: 1}          # 追光线：森林是光明的
        edits:
          - id: e3
            variants:
              - "他们遇见了一棵发光的树，"
              - "他们沿着光的足迹穿过了森林，"
        texts:
          - |
            越往前走，光越亮。森林里的一切都在发光，像是被那道光浸染过。
            **他们遇见了一棵发光的树，**树说：你们在追一个被光带走的孩子吧。
            它说那道光来自很远的地方，一个只有"被选中的人"才能去的地方。
            树垂下枝条，在他们面前铺出一条明亮的路。
      - when: {e1: 2}          # 消失线：森林寂静无人
        edits:
          - id: e3
            variants:
              - "他们走进了一座无声的森林，"
              - "他们在森林里只听见自己的脚步声，"
        texts:
          - |
            森林安静得不像话。没有鸟，没有风，连树叶落地的声音都没有。
            **他们走进了一座无声的森林，**每一步都踩在厚厚的落叶上，
            却听不见任何回响。树影在人走近时微微倾斜，像是在回避他们。
            他们忽然意识到：这座森林里，没有任何一个"别人"。
      - when: {e1: 'erase'}    # 记忆模糊线：森林也在遗忘
        edits:
          - id: e3
            variants:
              - "他们走进了一片正在褪色的森林，"
              - "他们沿着记忆的边缘走，"
        texts:
          - |
            森林的颜色正在变淡，像一张被水泡过的照片。树还是树，
            可它们的样子在不断改变，仿佛连它们也在忘记自己原本是什么。
            **他们走进了一片正在褪色的森林，**每走一步，
            身后就有一片树变成灰白。他们不敢回头，怕回头的时候，
            连自己也变成那样。
      - texts:
          - |
            他们走进了一片从没见过的森林。树干上长着会发光的苔藓，风穿过树叶时
            会发出低低的耳语。**他们遇见了会说话的树，**树问他们要往哪里去，
            他们说要去寻找一个被黑暗带走的朋友。树沉默了很久，指了一个方向，
            那正是连地图上都画着问号的地方。脚印在泥土里越来越深，谁也没有回头。

  # ------------------------------------------------------------
  # 四：山顶（选择点4）
  # ------------------------------------------------------------
  p4:
    write:
      origin: [48, 56]
      speed: 4
    branches:
      - when: {e1: 0, e2: 0, e3: 0}   # 最常规的线
        edits:
          - id: e4
            variants:
              - "山顶的云海里浮着一座小镇，"
              - "山顶的废墟里亮着一盏灯，"
        texts:
          - |
            翻过最后一道山脊时，他们已经走了很多天。**山顶的云海里浮着一座小镇，**
            镇上的钟楼在黄昏里敲了七下。他们挨家挨户地问，有没有人见过一个
            拿着相机的男孩。有位卖糖果的老奶奶说，三天前确实有个孩子来过，
            买走了所有的向日葵种子，然后朝着北边最暗的那片夜空走去了。
            小镇的尽头，路灯一盏接一盏地熄灭，仿佛在给他们指路。
      - when: {e1: 1}               # 追光线：小镇也在发光
        edits:
          - id: e4
            variants:
              - "山顶的云海里浮着一座发光的小镇，"
              - "山顶的塔楼亮着和那道光一样的光芒，"
        texts:
          - |
            他们顺着光走了很多天，最后看见**山顶的云海里浮着一座发光的小镇，**
            整座小镇都笼罩在一层淡淡的暖光里，像被那道光一直照到现在。
            他们挨家挨户地问，有没有人见过一个被光带走的男孩。
            有位卖糖果的老奶奶笑了：他啊，他在镇子最高的那座塔上，
            已经等了你们很久了。那光越来越亮，仿佛在呼唤他们。
      - when: {e1: 2}               # 消失线：小镇空无一人
        edits:
          - id: e4
            variants:
              - "山顶的云海里浮着一座空无一人的小镇，"
              - "山顶的街道上只有他们的影子，"
        texts:
          - |
            他们走了很多天，终于爬上山顶，看见**山顶的云海里浮着一座空无一人的小镇，**
            镇上的钟楼在黄昏里敲了七下，却没有人来听。
            他们挨家挨户地敲门，门都开着，屋里却空无一人。
            只有一张照片贴在墙上：一个男孩，拿着相机，背对着镜头。
            照片下面用铅笔写着一行字：你们终于来了。
      - when: {e1: 'erase'}         # 记忆线：小镇也在遗忘他们
        edits:
          - id: e4
            variants:
              - "山顶的云海里浮着一座灰白的小镇，"
              - "山顶的小镇像一张褪色的照片，"
        texts:
          - |
            他们走了很多天，终于爬上山顶，看见**山顶的云海里浮着一座灰白的小镇，**
            整座小镇没有一丝颜色，像一张褪了色的照片。
            他们挨家挨户地问，有没有人记得一个叫贝瑟尔的男孩。
            每个人都摇摇头，然后反问他们：你们是谁？你们来这里做什么？
            他们忽然发现，自己已经想不起出发那天的样子了。
      - texts:
          - |
            翻过最后一道山脊时，他们已经走了很多天。**山顶的云海里浮着一座小镇，**
            镇上的钟楼在黄昏里敲了七下。他们挨家挨户地问，有没有人见过一个
            拿着相机的男孩。有位卖糖果的老奶奶说，三天前确实有个孩子来过，
            买走了所有的向日葵种子，然后朝着北边最暗的那片夜空走去了。
            小镇的尽头，路灯一盏接一盏地熄灭，仿佛在给他们指路。

  # ------------------------------------------------------------
  # 五：夜空之下（选择点5）
  # ------------------------------------------------------------
  p5:
    write:
      origin: [48, 56]
      speed: 5
    branches:
      - when: {e1: 0, e2: 0, e3: 0, e4: 0}   # 最常规的线：正常重逢
        edits:
          - id: e5
            variants:
              - "他正坐在星空下，等着他们，"
              - "他正朝他们跑来，"
        texts:
          - |
            星光落在荒原上，世界安静得像一张刚冲洗出来的照片。
            他们在荒原的中央找到了那本相册，相册下面压着一小把向日葵种子。
            抬起头时，**他正坐在星空下，等着他们，**手里捧着那架旧相机，
            镜头盖不知道丢在了什么地方。他看见他们，先是愣住了，然后笑了，
            那笑容和四年前一样，仿佛中间那些漫长的日子只是一场不太好的梦。
      - when: {e1: 1}                       # 追光线：他站在光里
        edits:
          - id: e5
            variants:
              - "他正站在光里，朝他们伸出手，"
              - "他正站在塔顶的光柱下，"
        texts:
          - |
            荒原的尽头，一道光柱从天而降，照亮了整片夜空。
            他们跑过去，看见**他正站在光里，朝他们伸出手，**
            手里捧着那架旧相机，镜头盖不知道丢在了什么地方。
            他说：我就知道你们会来。那道光在他身后缓缓收拢，
            像一扇正在关上的门。他说：走吧，趁它还没关上。
      - when: {e1: 2}                       # 消失线：他像不存在一样
        edits:
          - id: e5
            variants:
              - "他正站在荒原中央，像一张空白照片，"
              - "他正慢慢变得透明，"
        texts:
          - |
            他们在荒原的中央找到了那本相册，相册是空的。
            抬起头时，**他正站在荒原中央，像一张空白照片，**
            手里捧着那架旧相机。他们喊他的名字，他缓缓转过头，
            脸上什么也没有。他举起相机，朝他们拍了一张照片，
            然后慢慢变得透明，像一张正在被冲洗掉的照片。
      - when: {e1: 'erase'}                 # 记忆线：他们快要忘记他了
        edits:
          - id: e5
            variants:
              - "他正站在荒原中央，像一段模糊的记忆，"
              - "他们几乎认不出他了，"
        texts:
          - |
            他们走了很久，久到快忘记自己在找谁。荒原的中央，
            一个男孩背对着他们站着，手里捧着一架旧相机。
            他们走近，**他正站在荒原中央，像一段模糊的记忆，**
            轮廓在一点点变淡。他回过头，想说什么，却发不出声音。
            他举起相机，镜头里映出他们——可他们的脸，也在慢慢变淡。
      - texts:
          - |
            星光落在荒原上，世界安静得像一张刚冲洗出来的照片。
            他们在荒原的中央找到了那本相册，相册下面压着一小把向日葵种子。
            抬起头时，**他正坐在星空下，等着他们，**手里捧着那架旧相机，
            镜头盖不知道丢在了什么地方。他看见他们，先是愣住了，然后笑了，
            那笑容和四年前一样，仿佛中间那些漫长的日子只是一场不太好的梦。

  # ------------------------------------------------------------
  # 结局：根据全部选择分支（每条线一个结局 + 默认）
  # ------------------------------------------------------------
  ending:
    readonly: true
    allowExit: false
    write:
      origin: [48, 56]
      speed: 5
    branches:
      - when: {e1: 0, e2: 0, e3: 0, e4: 0, e5: 0}   # 完美线：正常结局
        texts:
          - |
            回来的路上，没有人提起那天下午的黑洞。
            他们把向日葵种子种进了贝瑟尔家的花坛里，浇了水，然后并肩坐在台阶上。
            风把相册的纸页吹得哗哗响，照片里的人都在笑着。
            有些故事不需要结局，只需要有人愿意把它读完。
      - when: {e1: 1}                              # 追光线：他回来了，但会再次离开
        texts:
          - |
            那道光带着他们穿过漫长的夜，回到熟悉的小镇时，天刚蒙蒙亮。
            贝瑟尔站在家门口，像只是出门散了个步。他们谁都没有提那道光的事。
            只是后来，每当夜空亮起特别亮的光，贝瑟尔都会抬头看很久，
            然后轻声说：那道光说，它还会来的。
            有些故事不需要结局，只需要有人愿意把它读完。
      - when: {e1: 2}                              # 消失线：他从未真正存在过
        texts:
          - |
            他们回到小镇，把向日葵种子种进花坛，浇了水。
            风把相册的纸页吹得哗哗响，翻到最后，只剩一张空白照片。
            没有人提起贝瑟尔。没有人记得那天下午。只有奥布里偶尔
            会对着那张空白照片发呆，好像照片里本该有一个人。
            有些故事不需要结局，只需要有人愿意把它读完。
      - when: {e1: 'erase'}                        # 记忆线：遗忘开始蔓延
        texts:
          - |
            他们回到小镇，把向日葵种子种进花坛，浇了水。
            第二天，花坛里什么也没有长出来。第三天，他们开始
            记不清自己为什么要种这些种子。相册被收进了抽屉，
            风再也吹不到它的纸页。有些故事不需要结局，
            只需要有人愿意把它读完——可当没有人记得故事本身，
            它还算不算一个故事？
      - texts:                                     # 默认结局
          - |
            回来的路上，没有人提起那天下午的黑洞。
            他们把向日葵种子种进了贝瑟尔家的花坛里，浇了水，然后并肩坐在台阶上。
            风把相册的纸页吹得哗哗响，照片里的人都在笑着。
            有些故事不需要结局，只需要有人愿意把它读完。

  # ------------------------------------------------------------
  # 确认页：末尾"是否确定"
  # ------------------------------------------------------------
  confirm:
    confirm: true
    confirmChoices:
      - "确定"
      - "否"
    doneSwitchId: 1005
    readonly: true
    write:
      origin: [48, 56]
      speed: 4
    text: |
      故事到这里就结束了。
      你确定要合上这本书吗？
